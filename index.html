<!doctype html>
<html lang="en">
  <head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-PWC5LNYEG4"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-PWC5LNYEG4');

    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Critical Resource Preloads - High Priority -->
    <link rel="preload" as="script" href="/src/main.tsx" />
    
    <!-- Image Preloads with Priority Hints -->
    <link rel="preload" href="/src/assets/logo.svg" as="image" fetchpriority="high" />

    <!-- Apply the stored theme before paint (light by default) -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('airbridge-theme');
          var theme = stored === 'dark' ? 'dark' : 'light';
          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
    
    <!-- Font Optimization - System fonts (no Google Fonts for speed) -->
    <style>
      /* Use system font stack - fastest possible loading */
      html {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
    </style>
    
    <!-- Prefetch DNS for external services -->
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
    <title>AirBridge — Technology for the Modern Food Industry</title>
    
    <!-- Meta for SEO and sharing -->
    <meta name="description" content="AirBridge builds the technology restaurants and food businesses run on: ready-to-launch websites and ordering, till and payment systems that finally talk to each other, AI that answers the phone at your busiest hour, and reporting that adds up across every location.">
    <meta name="theme-color" content="#f8f6f0" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="AirBridge — Technology for the Modern Food Industry" />
    <meta property="og:description" content="AirBridge builds the technology restaurants and food businesses run on: ready-to-launch websites and ordering, till and payment systems that finally talk to each other, AI that answers the phone at your busiest hour, and reporting that adds up across every location." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Defer non-critical module script -->
    <script type="module" src="/src/main.tsx" defer></script>
    
    <!-- Inject web vitals measurement inline to reduce impact -->
    <script>
      // Minimal Web Vitals tracking - deferred until after load
      window.addEventListener('load', () => {
        setTimeout(() => {
          try {
            // Only load analytics after page interactive
            if (typeof window.dataLayer !== 'undefined') {
              console.log('Page interactive - analytics ready');
            }
          } catch (e) {}
        }, 3000);
      }, { once: true });
    </script>
  </body>
</html>
